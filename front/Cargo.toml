[package]
name = "front"
version = "0.1.1-beta.1"
description = "Very Tiny Server Frontend"
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["http", "development", "server", "frontend"]
publish = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.5.61", features = ["derive", "std"], default-features = false }
env_logger = "0.11.11"
http = "1.4.2"
serde = { version = "1.0.228", features = ["derive"] }
time = { version = "0.3.55", features = ["macros", "formatting"] }
tokio = { version = "1.53.0", features = ["macros", 'rt-multi-thread'], default-features = false }
tracing-subscriber = "0.3.23"
vetis.workspace = true
vetis-static.workspace = true
vetis-tokio.workspace = true
