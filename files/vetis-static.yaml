log_level: "error"
worker_threads: 24
max_blocking_threads: 120

server:
  enable_logging: true
  workers: 1
  hosts:
    - hostname: "localhost"
      root_directory: ".."
      enable_hsts: false
      allow_unsafe_conn: false
      protos:
        - "HTTP/2.0"
      bind_addresses:
        - ["0.0.0.0", 8443]
      security:
        ca_file: "certs/ca.der"
        cert_file: "certs/server.der"
        key_file: "certs/server.key.der"
        supported_alpns:
          - "h2"
      error_pages:
        404: "404.html"
      paths:
        - type: "static_path"
          uri: "/"
          directory: "files"
          extensions: "\\.(html)$"
          cache:
            max_file_size: 10485760
            ttl: "5m"
            tti: "2m"
            capacity: 1000
          index_files:
            - "index.html"
