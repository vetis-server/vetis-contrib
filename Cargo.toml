[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
    "front",
    #"vetis-auth",
    #"vetis-asgi",
    #"vetis-fcgi",
    "vetis-flash",
    "vetis-log",
    "vetis-otel",
    "vetis-proxy",
    "vetis-rhai",
    "vetis-rev-proxy",
    #"vetis-rack",
    #"vetis-rsgi",
    #"vetis-sapi",
    #"vetis-scgi",
    "vetis-static", "vetis-ws",
    #"vetis-wsgi",
]

[workspace.package]
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis-extras"
homepage = "https://github.com/vetis-server/vetis-extras"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

[workspace.dependencies]
deboa = { path = "../deboa/deboa" }
#deboa = { version = "0.1.5-beta.2" }
deboa-tokio = { path = "../deboa-tokio/deboa-tokio", default-features = false }
#deboa-tokio = { version = "0.1.4-beta.3", default-features = false }
http = "1.5.0"
hyper-body-utils = { version = "0.1.17", default-features = false }
log = "0.4.34"
logforth = { version = "0.30.1" }
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
typetag = "0.2.22"
vetis = { path = "../vetis/vetis" }
#vetis = { version = "0.1.7-beta.4" }
vetis-static = { path = "vetis-static", version = "0.1.1-beta.2" }
vetis-tokio = { path = "../vetis-tokio", default-features = false }
#vetis-tokio = { version = "0.1.2-beta.5", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
