[package]
name = "vetis-fcgi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server FCGI support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version.workspace = true

[features]
default = []

[dependencies]
fastcgi-client = { version = "0.12.0" }
http.workspace = true
hyper-body-utils.workspace = true
log.workspace = true
vetis = { path = "../../vetis/vetis" }
vetis-tokio = { path = "../../vetis-tokio", optional = true, default-features = false }
