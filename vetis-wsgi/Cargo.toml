[package]
name = "vetis-wsgi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server WSGI support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version.workspace = true

[features]
default = []

[dependencies]
crossfire = "3.1.20"
http.workspace = true
hyper-body-utils.workspace = true
log.workspace = true
pyo3.workspace = true
vetis = { path = "../../vetis/vetis" }
vetis-tokio = { path = "../../vetis-tokio", optional = true, default-features = false }
