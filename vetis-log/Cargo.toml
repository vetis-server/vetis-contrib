[package]
name = "vetis-log"
version = "0.1.0-beta.1"
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server logging support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "logging", "tracing"]
publish = true
rust-version.workspace = true

[dependencies]
colored = "3.1.1"
jiff = "0.2.37"
log = { workspace = true, features = ["serde_core"] }
logforth = { workspace = true, features = [
    "append-syslog",
    "append-file",
    "bridge-log",
    "layout-text",
] }
logforth-core = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
typetag = "0.2.21"
vetis.workspace = true
