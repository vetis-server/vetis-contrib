[package]
name = "vetis-static"
version = "0.1.1-beta.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server Static Files support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version.workspace = true

[features]
default = ["runtime-tokio"]
# runtime-compio = [
#   "vetis-compio/rust-tls",
#   "dep:compio",
# ]
# runtime-smol = [
#   "vetis-smol/rust-tls",
#   "dep:smol"
# ]
runtime-tokio = [
  "vetis-tokio/rust-tls",
  "dep:tokio"
]

[dependencies]
compio = { version = "0.19.2", optional = true, default-features = false }
duration-str = "0.21.0"
http.workspace = true
hyper-body-utils.workspace = true
log.workspace = true
minimime = "1.0.0"
regex = "1.12.4"
smol = { version = "2.0.2", optional = true, default-features = false }
send_wrapper = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
time = "0.3.55"
tokio = { version = "1.52.3", optional = true, default-features = false }
typetag = "0.2.21"
vetis.workspace = true
#vetis-compio = { version = "0.1.0", optional = true, default-features = false }
#vetis-smol = { version = "0.1.0", optional = true, default-features = false }
vetis-tokio = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
caramelo = "0.1.4"
compio = { version = "0.19.2", default-features = false }
deboa.workspace = true
# deboa-compio = { version = "0.1.1", default-features = false, features = [
#   "http2",
#   "rust-tls",
#   "default-rustls-provider",
#   "default-rustls-verifier",
# ] }
# deboa-smol = { version = "0.1.1", default-features = false, features = [
#   "http2",
#   "rust-tls",
#   "default-rustls-provider",
#   "default-rustls-verifier",
# ] }
deboa-tokio = { workspace = true, default-features = false, features = [
  "http2",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
smol = { version = "2.0.2", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["macros"] }
vetis-macros = { version = "0.1.3-beta.1" }
