worker_threads: 24
max_blocking_threads: 120

server:
  workers: 1
  log:
    dest: "stdout"
    log_level: "error"
  hosts:
    - hostname: "localhost"
      root_directory: "."
      enable_hsts: false
      allow_unsafe_conn: false
      protos:
        - "HTTP/2.0"
      bind_addresses:
        - ["0.0.0.0", 8443]
      tls:
        ca_file: "certs/ca.der"
        cert_file: "certs/server.der"
        key_file: "certs/server.key.der"
        supported_alpns:
          - "h2"
      error_pages:
        404: "files/404.html"
      hooks:
        - name: "static"
          directory: "files"
          extensions: "\\.(html)$"
          index_files:
            - "index.html"
