[package]
name = "vetis-auth"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server Auth support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "security", "auth"]
publish = true
rust-version.workspace = true

[features]
default = ["runtime-tokio", "basic-auth"]
basic-auth = ["argon2/password-hash", "argon2/alloc", "bcrypt/std", "base64"]
runtime-tokio = ["dep:tokio"]

[dependencies]
argon2 = { version = "0.6.0", optional = true, default-features = false }
base64 = { version = "0.23.1", optional = true, default-features = false }
bcrypt = { version = "0.19.3", optional = true, default-features = false }
http.workspace = true
log.workspace = true
serde = "1.0.228"
tokio = { workspace = true, features = ["fs", "rt-multi-thread"], optional = true }
typetag.workspace = true
vetis.workspace = true
