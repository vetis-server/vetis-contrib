[package]
name = "vetis-rhai"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server Rhai scripting support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version.workspace = true

[features]
default = ["runtime-tokio"]
runtime-tokio = ["vetis-tokio/rust-tls", "dep:tokio"]

[dependencies]
bytes = "1.12.1"
crossfire = "3.1.20"
duration-str = "0.21.0"
http.workspace = true
hyper-body-utils.workspace = true
log.workspace = true
rhai = { version = "1.26.1", features = ["sync"] }
regex = "1.12.4"
#send_wrapper = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
time = "0.3.55"
tokio = { version = "1.52.3", optional = true, default-features = false }
typetag.workspace = true
vetis.workspace = true
vetis-tokio = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
caramelo = "0.1.5"
compio = { version = "0.19.2", default-features = false }
deboa.workspace = true
deboa-tokio = { workspace = true, default-features = false, features = [
    "http2",
    "rust-tls",
    "default-rustls-provider",
    "default-rustls-verifier",
] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.52.3", default-features = false, features = ["macros"] }
#vetis-macros = { path = "../../vetis/vetis-macros" }
vetis-macros = { version = "0.1.3-beta.5" }
