[package]
name = "vetis-rack"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server Rack support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version.workspace = true

[features]
default = []

[dependencies]
http.workspace = true
hyper-body-utils.workspace = true
log.workspace = true
magnus = { version = "0.8.2" }
vetis = { path = "../../vetis/vetis" }
vetis-tokio = { path = "../../vetis-tokio", optional = true, default-features = false }

[target.'cfg(target_env = "musl")'.dependencies]
bindgen = { version = "*", optional = true, default-features = false, features = [
  "static",
] }
mimalloc = { version = "0.1.52", features = ["v2"] }
rb-sys = { version = "*", optional = true, default-features = false, features = [
  "ruby-static",
] }

[target.'cfg(not(target_env = "musl"))'.dependencies]
bindgen = { version = "*", optional = true, default-features = false, features = [
  "runtime",
] }
mimalloc = { version = "0.1.52", features = ["v2"] }
rb-sys = { version = "*", optional = true, default-features = false, features = [
  "link-ruby",
] }

[target.'cfg(target_os = "windows")'.dependencies]
bindgen = { version = "*", optional = true, default-features = false, features = [
  "runtime",
] }
rb-sys = { version = "*", optional = true, default-features = false, features = [
  "link-ruby",
] }
