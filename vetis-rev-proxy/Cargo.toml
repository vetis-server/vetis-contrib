[package]
name = "vetis-rev-proxy"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server Reverse Proxy support"
readme = "README.md"
license.workspace = true
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version.workspace = true

[features]
default = ["runtime-tokio"]
runtime-tokio = [
  "deboa-tokio/rust-tls",
  "deboa-tokio/default-rustls-provider",
  "deboa-tokio/default-rustls-verifier",
  "vetis-tokio/rust-tls",
]

[dependencies]
deboa.workspace = true
deboa-tokio.workspace = true
env_logger = "0.11.11"
http.workspace = true
http-body-util = "0.1.5"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
vetis.workspace = true
vetis-tokio.workspace = true

[dev-dependencies]
caramelo = "0.1.4"
tokio = { version = "1.53.1", default-features = false, features = ["macros"] }
